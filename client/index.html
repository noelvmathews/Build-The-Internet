<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeshPulse // 4-Node Gateway</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(16, 24, 39, 0.7);
      --card-border: rgba(16, 185, 129, 0.2);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.35);
      --cyan: #06b6d4;
      --red: #ef4444;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background: radial-gradient(circle at top right, #111827, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 980px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
    }

    .sub-badge {
      font-size: 0.75rem;
      color: var(--cyan);
      background: rgba(6, 182, 212, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: #0d131f;
      border: 1px solid #1f293d;
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--emerald);
      box-shadow: 0 0 8px var(--emerald-glow);
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 0.75rem 1.4rem;
      border-radius: 6px;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: #042f2e;
    }

    .btn-primary:hover {
      box-shadow: 0 0 16px var(--emerald-glow);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #1f2937;
      color: #d1d5db;
      border: 1px solid #374151;
    }

    .btn-secondary:hover {
      background: #374151;
    }

    /* Pipeline Indicators */
    .pipeline {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 1.5rem 0;
    }

    .pipeline::before {
      content: "";
      position: absolute;
      top: 24px;
      left: 10%;
      right: 10%;
      height: 2px;
      background: #1f293d;
      z-index: 1;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      flex: 1;
    }

    .circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #0d131f;
      border: 2px solid #1f293d;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      font-weight: bold;
      color: var(--text-muted);
    }

    .circle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .step.active .circle {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
      color: var(--cyan);
    }

    .step.completed .circle {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      box-shadow: 0 0 12px var(--emerald-glow);
    }

    .step.failed .circle {
      border-color: var(--red);
      color: var(--red);
      background: rgba(239, 68, 68, 0.15);
    }

    .step-title {
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Dual Output Panels */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 1.5rem;
    }

    .table-container {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .table-container th, .table-container td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #1f293d;
    }

    .table-container th {
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .tag-online {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--emerald);
      font-weight: 600;
    }

    .terminal {
      background: #05070a;
      border: 1px solid #111827;
      border-radius: 8px;
      padding: 1rem;
      height: 180px;
      overflow-y: auto;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .log-line {
      margin-bottom: 4px;
    }
    .log-time { color: #6b7280; }
    .log-info { color: var(--cyan); }
    .log-ok   { color: var(--emerald); }
    .log-err  { color: var(--red); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-group">
        <div class="pulse-dot"></div>
        <h1>MeshPulse</h1>
      </div>
      <div class="sub-badge">Distributed 4-Node Gateway</div>
    </header>

    <!-- Configuration Panel -->
    <div class="panel">
      <div class="form-grid">
        <div class="field" style="grid-column: span 2;">
          <label>DNS Registry Node</label>
          <input type="text" id="dnsNode" value="http://10.133.38.172:8000" />
        </div>
        <div class="field">
          <label>Identity Handle</label>
          <input type="text" id="username" value="noel" />
        </div>
        <div class="field">
          <label>Passphrase</label>
          <input type="password" id="password" value="pass123" />
        </div>
      </div>
      <div class="actions">
        <button class="btn-primary" onclick="triggerJourney()">Trigger Journey ⚡</button>
        <button class="btn-secondary" onclick="pollRegistry()">Poll Mesh Registry</button>
      </div>
    </div>

    <!-- Pipeline Visualizer -->
    <div class="panel">
      <div class="pipeline">
        <div class="step" id="step1">
          <div class="circle">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </div>
          <div class="step-title">1. Discovery</div>
        </div>
        <div class="step" id="step2">
          <div class="circle">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div class="step-title">2. Identity</div>
        </div>
        <div class="step" id="step3">
          <div class="circle">
            <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="step-title">3. Session Verify</div>
        </div>
      </div>
    </div>

    <!-- Dual Layout: Table & Realtime Terminal -->
    <div class="grid-2">
      <div class="panel">
        <h3 style="font-size: 0.85rem; margin-bottom: 10px; color: var(--text-muted); text-transform: uppercase;">Active Mesh Registry</h3>
        <table class="table-container">
          <thead>
            <tr><th>Domain</th><th>Destination</th><th>Status</th></tr>
          </thead>
          <tbody id="registryBody">
            <tr><td colspan="3" style="color: #6b7280;">No records fetched</td></tr>
          </tbody>
        </table>
      </div>

      <div class="panel">
        <h3 style="font-size: 0.85rem; margin-bottom: 10px; color: var(--text-muted); text-transform: uppercase;">Telemetry Terminal</h3>
        <div class="terminal" id="termLogs"></div>
      </div>
    </div>
  </div>

  <script>
    function log(msg, type = "info") {
      const term = document.getElementById("termLogs");
      const time = new Date().toLocaleTimeString();
      const line = document.createElement("div");
      line.className = "log-line";
      line.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }

    function setStep(num, status) {
      const step = document.getElementById(`step${num}`);
      step.className = `step ${status}`;
    }

    function resetPipeline() {
      ['step1', 'step2', 'step3'].forEach(id => {
        document.getElementById(id).className = 'step';
      });
    }

    async function pollRegistry() {
      const dns = document.getElementById("dnsNode").value.replace(/\/$/, "");
      log(`Querying discovery registry at ${dns}...`);
      
      const domains = ['acm-server', 'acm-db', 'acm-client'];
      const tbody = document.getElementById("registryBody");
      tbody.innerHTML = "";

      for (const d of domains) {
        try {
          const res = await fetch(`/proxy?target=${encodeURIComponent(`${dns}/lookup?domain=${d}`)}`);
          if (res.ok) {
            const data = await res.json();
            const ip = data.destination || data.ip;
            tbody.innerHTML += `<tr><td>${d}</td><td>${ip}</td><td><span class="tag-online">● Online</span></td></tr>`;
          } else {
            tbody.innerHTML += `<tr><td>${d}</td><td>--</td><td style="color: var(--amber)">○ Unresolved</td></tr>`;
          }
        } catch {
          tbody.innerHTML += `<tr><td>${d}</td><td>--</td><td style="color: var(--red)">✕ Unreachable</td></tr>`;
        }
      }
    }

    async function triggerJourney() {
      resetPipeline();
      const dns = document.getElementById("dnsNode").value.replace(/\/$/, "");
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;

      // 1. Discovery
      setStep(1, "active");
      log(`Resolving acm-server host...`);
      let srvIp = "";
      try {
        const res = await fetch(`/proxy?target=${encodeURIComponent(`${dns}/lookup?domain=acm-server`)}`);
        if (!res.ok) throw new Error("DNS Lookup failed");
        const data = await res.json();
        srvIp = data.destination || data.ip;
        setStep(1, "completed");
        log(`Discovery Success: acm-server at http://${srvIp}:3000`, "ok");
      } catch (err) {
        setStep(1, "failed");
        log(`Discovery Error: ${err.message}`, "err");
        return;
      }

      // 2. Identity Verification
      setStep(2, "active");
      log(`Authenticating identity "${u}"...`);
      const srvBase = `http://${srvIp}:3000`;

      try {
        const lRes = await fetch(`/proxy?target=${encodeURIComponent(`${srvBase}/login`)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });

        if (lRes.status === 429) {
          throw new Error("Brute-force protection: Account locked (429)");
        }
        if (!lRes.ok) {
          throw new Error(`Authentication Rejected (HTTP ${lRes.status})`);
        }

        setStep(2, "completed");
        log(`Identity verified. Session token established.`, "ok");
      } catch (err) {
        setStep(2, "failed");
        log(`Identity Failure: ${err.message}`, "err");
        return;
      }

      // 3. Session Validation
      setStep(3, "active");
      log(`Validating persistent presence at /whoami...`);
      try {
        const sRes = await fetch(`/proxy?target=${encodeURIComponent(`${srvBase}/whoami`)}`);
        if (!sRes.ok) throw new Error(`Session verify returned HTTP ${sRes.status}`);
        const data = await sRes.json();
        setStep(3, "completed");
        log(`Presence Confirmed: ${JSON.stringify(data)}`, "ok");
        log(`Distributed microservice pipeline validated!`, "ok");
      } catch (err) {
        setStep(3, "failed");
        log(`Session Verify Failure: ${err.message}`, "err");
      }
    }
  </script>
</body>
</html>
